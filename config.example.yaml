# ─────────────────────────────────────────────────────────────────────────────
# wayback-corpus-extractor — example config
#
# This worked example builds a sourced catalog of the *gear a hobby community
# actually recommends* — every product/tool people genuinely vouch for, ranked by
# how many independent pages attest it, each with a quote + a re-retrievable link.
#
# To point it at YOUR topic, change three things: `discovery` (where to look),
# `triage_keywords` (the cheap text filter), and `extraction` (what counts).
# ─────────────────────────────────────────────────────────────────────────────

# Any MLX model. The 30B MoE below was the sweet spot in testing: matched cloud
# Haiku quality, ~36 tok/s, fits in 24 GB. Bigger reasoners were slower AND worse
# (they over-think a simple judgment). Fit > power.
model: mlx-community/Qwen3-30B-A3B-4bit
think: true              # internal reasoning on (slower, cleaner). false = faster, noisier.
minutes: 60              # time budget per run. It's resumable — just run it again to continue.
output_dir: ~/wce-out    # items.jsonl (raw) + catalog.json (compiled) + done_urls.txt land here

# Raising this only matters on Apple Silicon for 30B+ models (see README GPU note).
need_wired_mb: 20000
wayback_gap_seconds: 1.0 # polite gap between archive.org calls. Raise if you get throttled.

# ── WHERE to look ────────────────────────────────────────────────────────────
discovery:
  # Blogs/sites: the tool enumerates their archived pages via Wayback CDX, keeping
  # only URLs whose slug matches `listing_keywords` (the dense "what I use" pages).
  domains:
    - example-gear-blog.com
    - anotherhobbysite.com
  # Subreddits: archived thread URLs are slug-based, so the same listing filter works.
  reddit_subs:
    - somehobby
  # Only fetch archived pages whose URL hints at a recommendation/listing page.
  listing_keywords: "recommend|favou?rite|best|must.?have|setup|loadout|kit|haul|review|what.?i.?use"

# ── Cheap PRE-FILTER (free) ──────────────────────────────────────────────────
# Only pages whose *text* matches this ever reach the (slow) model. This is what
# makes a local grind viable: skip pure chatter for free, ~3-5x the useful yield.
triage_keywords: "recommend|i love|favou?rite|best|worth it|holy grail|game.?changer|must.?have|can'?t live without"

# ── WHAT to extract ──────────────────────────────────────────────────────────
extraction:
  entity: "a specific product or tool the writer personally recommends or loves"
  definition: >
    A specific, named product/tool the writer personally uses, recommends, or is
    enthusiastic about. NOT a passing mention, NOT a question ("anyone tried
    X?"), NOT a brand in an ad, and NOT the generic category. It must be
    something the writer is genuinely vouching for.
  # One example item. The model returns a JSON array of items in exactly this shape.
  # (`evidence_excerpt` is added/required automatically — always include it.)
  schema:
    name: "<specific product, title case>"
    category: "<broad cluster, e.g. 'audio', 'storage', 'tooling'>"
    sentiment: "<loves | recommends | mixed>"
    evidence_excerpt: "<one short de-identified sentence from the page that proves it>"

# ── COMPILE options (optional) ───────────────────────────────────────────────
compile:
  # Words that are never a real entity (the topic itself, meta-terms). Filtered out.
  blocklist:
    - gear
    - product
    - tool
    - recommendation
    - setup
